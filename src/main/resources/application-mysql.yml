# MySQL profile. The database is created automatically if missing.
# Run with: set DB_PASSWORD, then  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lm_verify?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
