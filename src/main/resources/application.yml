server:
  port: 8095

spring:
  application:
    name: lm-verify
  profiles:
    # demo = in-memory H2, zero setup. Use "mysql" for the real database.
    active: ${SPRING_PROFILES_ACTIVE:demo}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  mail:
    # Free: Gmail SMTP with an app password. Leave GMAIL_USERNAME unset to disable email
    # (alerts are still shown in-app).
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  # Base URL printed inside QR codes. Set to your ngrok / LAN URL when scanning from a phone.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8095}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    expiration-ms: 86400000
  # ECDSA P-256 key pair for signing certificates. Generated on first start if missing.
  signing:
    key-dir: ${SIGNING_KEY_DIR:./keys}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
  allocation:
    max-inspections-per-day: 8
  alerts:
    due-soon-days: 30
    reminder-days: 30,15,7
  # Fraud/anomaly thresholds - configurable, not legal facts.
  fraud:
    max-gps-distance-m: 500
    min-duration-seconds: 180
    max-inspections-per-day: 15
    pass-rate-window-days: 30
    pass-rate-min-inspections: 10
    pass-rate-excess-points: 20
