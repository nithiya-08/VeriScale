# Demo profile: in-memory H2 database, zero setup. Data resets on every restart.
# Run with: mvn spring-boot:run
spring:
  datasource:
    url: jdbc:h2:mem:lmverify;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console
